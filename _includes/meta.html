<br>
<hr>
<span class="entry-tags">{% for tag in page.tags %}<a href="{{ site.url }}/tags/#{{ tag }}" title="Pages tagged {{ tag }}" class="tag"><span class="term">{{ tag }}</span></a>{% unless forloop.last %}{% endunless %}{% endfor %}</span>
<div class="share-container">
  <button id="share-btn" onclick="sharePost()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    Share this post
  </button>
  <span id="share-msg">Link copied!</span>
</div>
<script>
function sharePost(){var u=window.location.href,t=document.title;if(navigator.share){navigator.share({title:t,url:u})}else{navigator.clipboard.writeText(u).then(function(){var m=document.getElementById('share-msg');m.style.display='inline';setTimeout(function(){m.style.display='none'},2500)})}}
</script>
<div style="clear:both"></div>
