<div class="site-nav-wrap">
  <nav class="site-nav" role="navigation" aria-label="Main navigation">
    <a class="nav-identity" href="{{ site.url }}/">
      <img class="nav-avatar" src="{{ site.url }}/{{ site.logo }}" alt="{{ site.title }}">
      <span>{{ site.title }}</span>
    </a>
    <div class="nav-links" id="nav-links">
      <a class="nav-link{% if page.url == '/about/' or page.url contains '/about' %} active{% endif %}" href="{{ site.url }}/about/">About</a>
      <a class="nav-link{% if page.url contains '/posts/' or page.layout == 'stream' or page.layout == 'post' %} active{% endif %}" href="{{ site.url }}/posts/">Posts</a>
      <a class="nav-link{% if page.url == '/publications/' or page.url contains 'publications' %} active{% endif %}" href="{{ site.url }}/publications/">Research</a>
      <a class="nav-link{% if page.url contains '/personal' %} active{% endif %}" href="{{ site.url }}/personal/">Personal</a>
    </div>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>
</div>
<div class="nav-mobile-menu" id="nav-mobile-menu" role="dialog" aria-label="Mobile navigation">
  <a class="nav-mobile-link" href="{{ site.url }}/about/">About</a>
  <a class="nav-mobile-link" href="{{ site.url }}/posts/">Posts</a>
  <a class="nav-mobile-link" href="{{ site.url }}/publications/">Research</a>
  <a class="nav-mobile-link" href="{{ site.url }}/personal/">Personal</a>
</div>
<script>
(function(){
  var btn = document.getElementById('nav-hamburger');
  var menu = document.getElementById('nav-mobile-menu');
  if (!btn || !menu) return;
  btn.addEventListener('click', function(){
    var open = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', function(e){
    if (!btn.contains(e.target) && !menu.contains(e.target)) {
      menu.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
