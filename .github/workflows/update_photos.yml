name: Update Photo Gallery

on:
  schedule:
    - cron: '30 6 * * *'   # daily at 06:30 UTC (offset from stream at 06:00)
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests feedparser PyYAML

      - name: Fetch photos
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
        run: python scripts/fetch_photos.py

      - name: Commit updated photos.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/photos.json
          git diff --staged --quiet || (git commit -m "chore: update photo gallery [skip ci]" && git push)
