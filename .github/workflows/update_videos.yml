name: Update YouTube videos

on:
  schedule:
    - cron: '45 6 * * *'   # 06:45 UTC daily (offset from stream/photos runs)
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyYAML

      - name: Fetch YouTube videos
        run: python scripts/fetch_videos.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/videos.yml _data/youtube_channel_id.txt
          git diff --staged --quiet || \
            git commit -m "chore: update videos.yml [skip ci]" && \
            git push
