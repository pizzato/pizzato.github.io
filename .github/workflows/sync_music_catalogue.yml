name: Sync Music Catalogue

on:
  schedule:
    # Daily at 18:43 UTC (05:43 Sydney daylight time / 04:43 standard time).
    - cron: '43 18 * * *'
  workflow_dispatch:

# Share the lock with the other generated-data writer on master.
concurrency:
  group: sync-site-data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout publishing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test catalogue refresh and artwork preservation
        run: python -m unittest discover -s tests -p 'test_music_*.py'

      - name: Refresh YouTube playlists and video thumbnails
        run: |
          for attempt in 1 2 3; do
            if python spielbotmusic/_tools/refresh_catalogue.py --refresh --download-thumbnails; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          echo '::error::YouTube refresh failed; the published catalogue has been preserved.'
          exit 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate website build
        run: bundle exec jekyll build

      - name: Commit refreshed catalogue and artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add spielbotmusic/assets/catalogue.json spielbotmusic/assets/videos spielbotmusic/assets/artists
          if ! git diff --staged --quiet; then
            git commit -m 'chore: refresh music catalogue from YouTube [skip ci]'
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      # GITHUB_TOKEN commits must not rely on triggering a Pages build themselves.
      - name: Request GitHub Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Verify refreshed catalogue is live
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 15 \
              "${site_url%/}/spielbotmusic/assets/catalogue.json?refresh=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" \
              --output "$RUNNER_TEMP/published-music-catalogue.json" \
              && cmp --silent spielbotmusic/assets/catalogue.json "$RUNNER_TEMP/published-music-catalogue.json"; then
              echo 'The refreshed music catalogue is live.'
              echo "Music catalogue refreshed and verified at ${site_url%/}/spielbotmusic/" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo '::error::Catalogue committed, but publication could not be verified within ten minutes.'
          exit 1
