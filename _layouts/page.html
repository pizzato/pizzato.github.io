---
layout: compress
---
<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    {% include head.html %}
</head>
<body>
    {% include nav.html %}
    {% include page-hero.html %}

    <main class="page-layout">
      <header class="page-header">
        <a class="back-btn" href="{{ site.url }}/">
          <i class="fa-solid fa-arrow-left" style="font-size:11px"></i>
          Home
        </a>
        <h1 class="display-md">{{ page.title }}</h1>
      </header>

      <div class="page-content">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <span>&copy; {{ 'now' | date: "%Y" }} Luiz Pizzato.</span>
      <div class="footer-right">
        <a href="{{ site.url }}/feed.xml">RSS Feed</a>
      </div>
    </footer>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="{{ site.url }}/assets/js/revamp.js" defer></script>
    {% if site.mathjax == true %}
    <script async src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
    {% endif %}
    {% if site.google.analytics %}
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ site.google.analytics }}', 'auto');
      ga('send', 'pageview');
    </script>
    {% endif %}
</body>
</html>
